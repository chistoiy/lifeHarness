
    <!-- ===== H1 健康主页（专版工作台 · 入口=仪表盘宫格「健康」） ===== -->
    <section id="p-health" class="page px-5 safe-pb no-scrollbar">
      <div class="grad rounded-3xl p-4 text-white shadow-lg shadow-indigo-500/20">
        <div class="flex items-center justify-between">
          <b class="text-[13px]">今日概览</b>
          <span class="text-[10px] opacity-80" id="htTodayTx">09-19 周六</span>
        </div>
        <div class="flex items-center gap-4 mt-2">
          <div class="relative w-[74px] h-[74px] shrink-0">
            <svg viewBox="0 0 42 42" class="w-[74px] h-[74px] -rotate-90"><circle cx="21" cy="21" r="17" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="5"/><circle id="heroRing" cx="21" cy="21" r="17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 107"/></svg>
            <span class="absolute inset-0 flex flex-col items-center justify-center leading-none"><b class="text-[15px]" id="heroRingN">0</b><span class="text-[8px] opacity-80">杯水</span></span>
          </div>
          <div class="flex-1 min-w-0 grid grid-cols-3 gap-2 text-center">
            <button class="bg-white/15 rounded-xl py-2 active:scale-95 transition" onclick="htNav('p-sleepLog')"><b id="heroSleep" class="text-[15px]">—</b><div class="text-[9px] opacity-75">昨晚睡眠 · 小时</div></button>
            <button class="bg-white/15 rounded-xl py-2 active:scale-95 transition" onclick="htNav('p-exLog')"><b id="heroEx" class="text-[15px]">—</b><div class="text-[9px] opacity-75">今日运动 · 分钟</div></button>
            <button class="bg-white/15 rounded-xl py-2 active:scale-95 transition" onclick="htNav('p-body')"><b id="heroW" class="text-[15px]">—</b><div class="text-[9px] opacity-75">当前体重 kg</div></button>
          </div>
        </div>
        <div class="mt-2.5 text-[10px] opacity-80" id="heroTip">—</div>
      </div>

      <div class="card mt-3 !p-3">
        <div class="grid grid-cols-7 gap-1 text-center text-[9px] text-slate-500 dark:text-slate-400 font-semibold" id="hEntryRow"></div>
      </div>

      <div class="mt-3 grid grid-cols-2 gap-3">
        <div class="card">
          <div class="flex items-center justify-between"><span class="flex items-center gap-1.5"><span id="hl-water"></span><b class="text-[13px]">喝水</b></span><span class="text-[10px] text-slate-400" id="wTargetTx"></span></div>
          <div class="text-2xl font-extrabold mt-1"><span id="waterN">0</span><span class="text-sm text-slate-400 font-semibold"> 杯</span></div>
          <div class="grid grid-cols-4 gap-1.5 mt-2" id="waterRow"></div>
          <div class="flex gap-2 mt-2"><button class="flex-1 mini-btn" onclick="water(1)">＋1 杯</button><button class="flex-1 mini-btn" onclick="water(-1)">撤销</button></div>
        </div>
        <div class="card">
          <div class="flex items-center justify-between"><span class="flex items-center gap-1.5"><span id="hl-sleep"></span><b class="text-[13px]">睡眠</b></span><button class="mini-btn" onclick="hSleepOpen()">＋ 记录</button></div>
          <div class="text-2xl font-extrabold mt-1"><span id="slN">—</span><span class="text-sm text-slate-400 font-semibold"> 小时</span></div>
          <div class="flex items-end gap-[3px] h-10 mt-2" id="slBars"></div>
          <div class="text-[9px] text-slate-400 mt-1.5">目标 <b id="slT">—</b> · 近 7 天按时入睡 <b id="slOndt">—</b> 天</div>
        </div>
        <div class="card min-w-0">
          <div class="flex items-center justify-between"><span class="flex items-center gap-1.5"><span id="hl-ex"></span><b class="text-[13px]">运动 <span class="vchip">V1.x</span></b></span><button class="mini-btn" onclick="htNav('p-exLog')">记录 ›</button></div>
          <div id="exToday" class="text-sm font-extrabold mt-1">未记录</div>
          <div class="text-[10px] text-slate-400 mt-0.5" id="exWeekTx">—</div>
          <div class="flex gap-2 mt-2 text-xs items-center">
            <input id="spKm" class="inp !w-16 !py-1.5 text-xs" type="number" step="0.1" inputmode="decimal" placeholder="km">
            <input id="spMin" class="inp !w-16 !py-1.5 text-xs" type="number" inputmode="numeric" placeholder="min">
            <button class="mini-btn" onclick="sportCalc()">算配速</button>
          </div>
          <div id="spOut" class="mt-1 text-xs font-bold min-h-[16px]" style="color:var(--accent)"></div>
          <div class="flex gap-2 mt-1"><button class="flex-1 mini-btn" onclick="htExOpen()">＋ 记一笔</button><button class="flex-1 mini-btn" id="exTimerBtn" onclick="exTimerToggle()">开始计时</button></div>
        </div>
        <div class="card min-w-0">
          <div class="flex items-center justify-between"><span class="flex items-center gap-1.5"><span id="hl-drug"></span><b class="text-[13px]">用药 <span class="vchip">V1.x</span></b></span><button class="mini-btn" onclick="htNav('p-med')">管理 ›</button></div>
          <div class="text-sm font-extrabold mt-1"><span id="medDone">0</span>/<span id="medTotal">0</span> 次 · 今日</div>
          <div id="medChips" class="flex flex-wrap gap-1.5 mt-2 min-w-0 overflow-hidden"></div>
        </div>
      </div>

      <div class="card mt-3 !p-0 overflow-hidden">
        <div class="flex items-center justify-between px-4 pt-3 pb-1">
          <b class="text-[13px]">近 14 天达标概览</b>
          <span class="flex items-center gap-1 text-[10px] text-slate-400">低<div class="flex gap-[3px]"><span class="w-3 h-3 rounded bg-mint/20"></span><span class="w-3 h-3 rounded bg-mint/50"></span><span class="w-3 h-3 rounded bg-mint"></span></div>高</span>
        </div>
        <div class="grid grid-cols-7 gap-1.5 px-4 pb-3.5" id="hHubHeat"></div>
      </div>

      <div class="flex items-center justify-between mt-4 mb-1"><b class="text-[13px]">最近记录</b><span class="text-[10px] text-slate-400">点条目可编辑</span></div>
      <div id="hStream" class="space-y-2"></div>

      <button onclick="htNav('p-care')" class="mt-4 w-full card flex items-center gap-3 text-left active:scale-[.99] transition">
        <span class="w-9 h-9 rounded-xl bg-pink-50 dark:bg-pink-500/15 text-pink-500 flex items-center justify-center" id="hl-care"></span>
        <div class="flex-1"><div class="text-sm font-bold">母婴呵护</div><div class="text-[11px] text-slate-400">生理周期/排卵 · 宝宝喂养记录与生长曲线 ›</div></div>
        <span class="text-slate-300">›</span></button>
      <div class="text-center text-[10px] text-slate-300 dark:text-slate-600 mt-4 pb-2">健康数据仅存本机 · 提醒不替代医嘱</div>
    </section>

    <!-- ===== H2 身体数据 ===== -->
    <section id="p-body" class="page px-5 safe-pb no-scrollbar">
      <div class="grid grid-cols-4 gap-2 text-center">
        <div class="card !p-2.5"><b id="bdW" class="text-lg block">—</b><span class="text-[9px] text-slate-400">kg 体重</span></div>
        <div class="card !p-2.5"><b id="bdB" class="text-lg block">—</b><span class="text-[9px] block" id="bdBm">BMI</span></div>
        <div class="card !p-2.5"><b id="bdH" class="text-lg block">175</b><span class="text-[9px] text-slate-400">cm 身高</span></div>
        <div class="card !p-2.5"><b id="bdF" class="text-lg block">—</b><span class="text-[9px] text-slate-400">% 体脂</span></div>
      </div>
      <div class="card mt-3">
        <div class="flex items-center justify-between">
          <div class="flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1 text-[11px] font-bold">
            <button class="seg-on rounded-lg px-2.5 py-1" data-v="30" onclick="hseg(this);HT.bodyRange=30;hBodyChart()">30 天</button>
            <button class="rounded-lg px-2.5 py-1 text-slate-500" data-v="90" onclick="hseg(this);HT.bodyRange=90;hBodyChart()">90 天</button>
            <button class="rounded-lg px-2.5 py-1 text-slate-500" data-v="365" onclick="hseg(this);HT.bodyRange=365;hBodyChart()">365 天</button>
          </div>
          <button class="mini-btn" onclick="hRecOpen()">＋ 记录</button>
        </div>
        <svg id="bdSvg" viewBox="0 0 300 120" class="w-full h-28 mt-1"></svg>
        <div class="grid grid-cols-3 text-center text-[10px] mt-1 gap-1">
          <div class="rounded-xl bg-slate-100 dark:bg-slate-800 py-1.5"><div class="text-slate-400">周变化</div><b id="boWk" class="text-[13px]">—</b></div>
          <div class="rounded-xl bg-slate-100 dark:bg-slate-800 py-1.5"><div class="text-slate-400">区间变化</div><b id="boRg" class="text-[13px]">—</b></div>
          <div class="rounded-xl bg-slate-100 dark:bg-slate-800 py-1.5"><div class="text-slate-400">距目标</div><b id="boG" class="text-[13px]">—</b></div>
        </div>
      </div>
      <div class="card mt-3 !p-0">
        <div class="px-4 py-2.5 flex items-center justify-between"><b class="text-[13px]">测量记录</b><span class="text-[9px] text-slate-400" id="boCount">—</span></div>
        <div id="bodyList" class="divide-y divide-slate-100 dark:divide-slate-800"></div>
      </div>
    </section>
