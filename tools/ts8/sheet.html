  <div id="sheetTsCat" class="sheet hidden fixed md:absolute inset-0 z-50 bg-black/40 items-end" onclick="if(event.target===this)closeSheet('sheetTsCat')">
    <div class="sheet-panel w-full bg-white dark:bg-slate-900 rounded-t-3xl p-5 pb-8 max-h-[80vh] overflow-y-auto no-scrollbar">

      <div class="flex items-center gap-2">
        <span id="tscDot" class="w-3 h-3 rounded-full shrink-0"></span>
        <div class="font-extrabold text-sm flex-1" id="tscTitle">分类</div>
        <span class="text-[10px] text-slate-400" id="tscPeriod"></span></div>
      <div class="mt-3 grid grid-cols-3 gap-2 text-center" id="tscStat"></div>

      <div class="mt-4 flex gap-2">
        <button class="flex-1 py-3 rounded-xl border border-slate-300 dark:border-slate-700 text-sm font-bold" onclick="closeSheet('sheetTsCat')">收起</button>
        <button class="flex-1 py-3 rounded-xl grad text-white text-sm font-bold" onclick="closeSheet('sheetTsCat');navTo('p-calendar')">去时间页</button></div>
    </div>
