<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LifeHarness · 原型 V2 · 新瑞士便当格</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config={darkMode:'class',theme:{extend:{
 colors:{ink:'var(--ink)',ink2:'var(--ink-2)',paper:'var(--paper)',card:'var(--card)',line:'var(--line)',acc:'var(--accent)',ok:'var(--ok)',no:'var(--no)'},
 fontFamily:{sans:['Inter','PingFang SC','Microsoft YaHei','sans-serif']},
 borderRadius:{c:'10px',b:'8px'}}}}
</script>
<style>
:root{--paper:#F6F5F1;--card:#FFFFFF;--ink:#141414;--ink-2:#6B6A64;--line:#E3E1D8;--accent:#FF4A1F;--ok:#1E874B;--no:#C0392B;--shell:#1c1c1a}
html.dark{--paper:#0D0D0B;--card:#161613;--ink:#F2F1EC;--ink-2:#9C9B93;--line:#2A2A24;--accent:#FF5C33;--shell:#000}
html,body{height:100%;background:var(--shell);font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif}
*{-webkit-tap-highlight-color:transparent}
#phone{width:392px;height:848px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);border-radius:46px;border:10px solid #000;box-shadow:0 30px 80px rgba(0,0,0,.55);font-size:14px}
@media (max-width:520px){body{display:block}#phone{width:100vw;height:100dvh;border:0;border-radius:0}}
body{display:flex;align-items:center;justify-content:center}
#screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:110px;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--ink-2);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
html.dark .chip.on{background:var(--ink);color:#111}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn-p{background:var(--ink);border-color:var(--ink);color:var(--paper)}
html.dark .btn-p{color:#111}
.btn-a{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-s{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.hairline{height:1px;background:var(--line)}
input,textarea,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--ink);width:100%;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:var(--ink)}
/* ---- 内嵌真滚轮（scroll-snap 逐档吸中） ---- */
.wheel{height:168px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:63px 0}
.wheel::-webkit-scrollbar{display:none}
.wit{height:42px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:15px;color:var(--ink-2);transition:all .12s;user-select:none;cursor:grab}
.wit.on{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
.wheelcol{flex:1;border-left:1px solid var(--line)}
.wheelcol:first-child{border-left:0}
.wheelmask{position:relative;pointer-events:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:42px;margin-top:-105px}
/* ---- sheet / toast ---- */
#sheet-root{position:absolute;inset:0;z-index:60;display:none}
#sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .18s}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:16px 16px 0 0;border-top:1px solid var(--line);max-height:78%;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .22s cubic-bezier(.25,.8,.3,1)}
#sheet-body{overflow-y:auto;padding:0 18px 24px;scrollbar-width:none}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;transition:all .18s;z-index:90;pointer-events:none;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}
html.dark #toast{color:#111}
/* ---- 动效 ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp .18s ease}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:pulseRed 1.2s infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.breath{animation:breath 1.6s infinite}
/* ---- bento ---- */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.bcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.bcard.span2{grid-column:span 2}
.bcard.edit{border-style:dashed;cursor:grab}
.bcard.dragover{outline:2px solid var(--accent);outline-offset:-2px}
/* 底栏 / FAB / 计时条 */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-top:1px solid var(--line);display:flex;padding:6px 4px 22px}
.bi{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink-2);cursor:pointer;padding-top:6px;position:relative}
.bi.on{color:var(--ink)}
.bi.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:2px;background:var(--accent)}
#fab{position:absolute;right:16px;bottom:96px;z-index:55;width:48px;height:48px;border-radius:12px;background:var(--ink);color:var(--paper);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:4px 4px 0 rgba(0,0,0,.18)}
html.dark #fab{color:#111}
#timerbar{position:absolute;left:16px;right:16px;bottom:92px;z-index:52;display:none;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
html.dark #timerbar{color:#111}
.catdot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg>div{padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg>div.on{background:var(--ink);color:var(--paper)}
html.dark .seg>div.on{color:#111}
.strike{text-decoration:line-through;opacity:.5}
::-webkit-scrollbar{width:0;height:0}
.kbdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
</style>
</head>
<body>
<div id="phone">
  <div id="screen"></div>
  <div id="timerbar"></div>
  <div id="fab" onclick="A.fabAct()"></div>
  <div id="bar"></div>
  <div id="sheet-root"><div id="sheet-mask" onclick="UI.closeSheet()"></div>
    <div id="sheet"><div class="flex items-center justify-between px-[18px] pt-4 pb-2"><div class="eyebrow" id="sheet-title"></div><div class="cursor-pointer p-1 -m-1 text-ink2" onclick="UI.closeSheet()" id="sheet-x"></div></div>
    <div id="sheet-body"></div></div></div>
  <div id="toast"></div>
</div>

/* ================= 分类（全局同源两级） ================= */

const UI={
 toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;t.style.transform='translateX(-50%) translateY(0)';clearTimeout(UI._tt);UI._tt=setTimeout(()=>{t.style.opacity=0;t.style.transform='translateX(-50%) translateY(8px)'},1900)},
 stack:[],
 _show(o){$('#sheet-title').textContent=o.title||'';const html=typeof o.html==='function'?o.html():o.html;const foot=typeof o.foot==='function'?o.foot():o.foot;
  const b=$('#sheet-body');b.innerHTML=html+(foot?'<div class="flex gap-2 pt-4" style="position:sticky;bottom:0;background:var(--paper)">'+foot+'</div>':'');b.scrollTop=0;
  $('#sheet-root').style.display='block';requestAnimationFrame(()=>{$('#sheet-mask').style.opacity=1;$('#sheet').style.transform='translateY(0)'});
  o.onMount&&o.onMount(b)},
 sheet(o){this.stack.push(o);this._show(o)},
 closeSheet(){if(!this.stack.length){$('#sheet-root').style.display='none';return}this.stack.pop();if(!this.stack.length){$('#sheet').style.transform='translateY(102%)';$('#sheet-mask').style.opacity=0;setTimeout(()=>{if(!this.stack.length)$('#sheet-root').style.display='none'},200)}else{this._show(this.stack[this.stack.length-1])}},
 wheels:{},
 wheel(host,items,val,onch){const H=42;host.innerHTML=items.map((it,i)=>'<div class="wit" data-i="'+i+'">'+(typeof it==='object'?it.l:it)+'</div>').join('');
  let cur=Math.max(0,items.findIndex(it=>(typeof it==='object'?it.v:it)===(typeof val==='object'?val.v:val)));if(cur<0)cur=0;
  const idx=()=>Math.min(items.length-1,Math.max(0,Math.round(host.scrollTop/H)));
  const paint=()=>{const k=idx();[...host.children].forEach((el,i)=>el.classList.toggle('on',i===k))};
  const fire=()=>{const v=items[idx()];onch&&onch(typeof v==='object'?v.v:v)};
  host.onscroll=()=>{paint();clearTimeout(host._t);host._t=setTimeout(fire,90)};
  host.onwheel=e=>{e.preventDefault();host.scrollTop+=Math.sign(e.deltaY)*H;paint();clearTimeout(host._t);host._t=setTimeout(fire,120)};
  setTimeout(()=>{host.scrollTop=cur*H;paint()},0);
  return{get:()=>{const v=items[idx()];return typeof v==='object'?v.v:v}}},
 mkTimeWheelRow(box,cols,keyPrefix,def){/* def: [[y..],[m..],[d..]] */const o={};cols.forEach((c,i)=>{const el=box.querySelector('[data-wh="'+keyPrefix+i+'"]');o['w'+i]=this.wheel(el,c.items,c.val)})
  return o},
 ring(pct,color,size,sw,txt){size=size||44;sw=sw||5;const r=(size-sw)/2,c=2*Math.PI*r;return '<div class="relative" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+sw+'"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c*pct+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>'+(txt?'<div class="absolute inset-0 flex items-center justify-center num" style="font-size:'+(size/3.4)+'px">'+txt+'</div>':'')+'</div>'},
 pie(parts,size){size=size||88;let acc=0;const seg=parts.map(p=>{const s=acc;acc+=p.pct;return catColor(p.cat)+' '+s+'% '+acc+'%'}).join(',');
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:conic-gradient('+seg+');position:relative"><div class="absolute" style="inset:26%;border-radius:50%;background:var(--card)"></div></div>'},
 line(data,w,h,color,fmt){w=w||300;h=h||70;const mx=Math.max(...data),mn=Math.min(...data),sp=mx-mn||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*w,h-6-(v-mn)/sp*(h-14)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.8"/>'+
   '<circle cx="'+pts[0][0].toFixed(1)+'" cy="'+pts[0][1].toFixed(1)+'" r="2.6" fill="var(--card)" stroke="var(--accent)" stroke-width="1.6"/><circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="2.6" fill="var(--accent)"/>'+
   '<text x="2" y="'+(h-2)+'" font-size="9" fill="var(--ink-2)">'+fmt(mn)+'</text><text x="2" y="10" font-size="9" fill="var(--ink-2)">'+fmt(mx)+'</text></svg>'},
 iconBtn(n,act,cls){return '<div class="p-2 -m-1 cursor-pointer '+(cls||'text-ink2')+'" onclick="'+act+'">'+I(n,'w-5 h-5')+'</div>'}}

 if(f==='已完成')return !!t.done;

function mdTable(rows){const parse=r=>r.split('|').slice(1,-1).map(c=>c.trim());

function md2(src){const inline=s=>s.replace(/&amp;/g,'&').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/~~([^~]+)~~/g,'<s>$1</s>').replace(/`([^`]+)`/g,'<code class="px-1 rounded" style="background:'+tint('var(--ink)',8)+'">$1</code>').replace(/\$([^$]+)\$/g,'<i style="color:var(--accent);font-family:Georgia,serif">$1</i>').replace(/\[([^\]]+)\]\(([^)]*)\)/g,'<u class="underline decoration-dotted">$1</u>');
 const out=[];let tbl=[];
 src.split('\n').forEach(l=>{if(/^\|.*\|$/.test(l)){tbl.push(l);return}if(tbl.length){out.push(mdTable(tbl));tbl=[]}
  let m;const e=esc(l);
  if(m=e.match(/^(#{1,6})\s+(.*)/))out.push('<div style="font-weight:800;font-size:'+(23-m[1].length*1.6)+'px;line-height:1.3" class="mt-2 mb-1">'+inline(m[2])+'</div>');
  else if(/^---+$/.test(e))out.push('<div class="hairline my-2"></div>');
  else if(m=e.match(/^&gt;\s?(.*)/))out.push('<div style="border-left:3px solid var(--accent);padding-left:9px" class="text-ink2 my-0.5">'+inline(m[1])+'</div>');
  else if(m=e.match(/^- \[( |x)\]\s?(.*)/))out.push('<div class="flex gap-2 items-start my-0.5"><span style="color:'+(m[1]==='x'?'var(--ok)':'var(--ink-2)')+'">'+(m[1]==='x'?'☑':'☐')+'</span><span'+(m[1]==='x'?' class="strike"':'')+'>'+inline(m[2])+'</span></div>');
  else if(m=e.match(/^- (.*)/))out.push('<div class="flex gap-1.5 my-0.5"><span class="text-ink2">•</span><span>'+inline(m[1])+'</span></div>');
  else if(m=e.match(/^\$\$([\s\S]*)\$\$/))out.push('<div class="text-center num my-2" style="font-family:Georgia,serif;font-size:16px;color:var(--accent)">'+m[1]+'</div>');
  else if(e.trim())out.push('<p style="line-height:2.15;letter-spacing:.03em" class="my-1">'+inline(e)+'</p>');else out.push('<div style="height:10px"></div>')});
 if(tbl.length)out.push(mdTable(tbl));return out.join('')}
