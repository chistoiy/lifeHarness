<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeHarness · 高保真UI原型 V2「青磁」</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,400..600&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { fontFamily: { sans: ['Inter','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei','sans-serif'] } } }
}
</script>
<style>
/* ============ 设计令牌 · 青磁 Celadon ============ */
:root{
  --bg:#f0efe9; --bg2:#e7e5dc; --card:#fbfaf6; --card2:#f4f2ea;
  --ink:#152119; --ink2:#4a5a50; --ink3:#7f8d83;
  --line:#e0ddcf; --line2:#cfcbba;
  --acc:#0e6f63; --acc2:#0b5a50; --acc-ink:#f6fffb; --acc-soft:#dbeee7; --acc-glow:rgba(14,111,99,.22);
  --vio:#6d5ae0; --vio-soft:#e9e5fb;
  --rose:#d1436a; --rose-soft:#fbe4ea;
  --amber:#c07c10; --amber-soft:#f8ecd6;
  --blue:#2f6fd0; --blue-soft:#e0eafa;
  --ok:#2c8a4f; --ok-soft:#ddefe3;
  --danger:#cf3f2f; --danger-soft:#fbe5e1;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(21,33,25,.05), 0 10px 30px -14px rgba(21,33,25,.22);
  --sh-sm:0 1px 2px rgba(21,33,25,.06), 0 4px 14px -8px rgba(21,33,25,.18);
  --sheet:26px;
  --font-ui:'Inter','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;
  --font-num:'Inter','PingFang SC',sans-serif;
  --track:#e2dfd2;
}
.dark{
  --bg:#101415; --bg2:#0b0e0f; --card:#1a1f21; --card2:#212729;
  --ink:#e8eeea; --ink2:#9fae a5; --ink2:#9faca4; --ink3:#6c7a72;
  --line:#2a3134; --line2:#3a4347;
  --acc:#41c3ad; --acc2:#5fd6c3; --acc-ink:#06231e; --acc-soft:#14342e; --acc-glow:rgba(65,195,173,.18);
  --vio:#9d8dff; --vio-soft:#241f45;
  --rose:#ff7d9c; --rose-soft:#3a1c27;
  --amber:#e8b45c; --amber-soft:#3a2c14;
  --blue:#7fabf2; --blue-soft:#1a2740;
  --ok:#6fd094; --ok-soft:#16301f;
  --danger:#ff8778; --danger-soft:#3a1c17;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.7);
  --sh-sm:0 1px 2px rgba(0,0,0,.45);
  --track:#242b2d;
}
/* ---- 皮肤：小清新 ---- */
[data-skin=fresh]{ --bg:#eef5f1; --bg2:#e2efe9; --card:#ffffff; --card2:#f2f8f5;
  --ink:#1d2b26; --ink2:#54706a; --ink3:#8aa39c; --line:#dcece5; --line2:#c6ddd4;
  --acc:#18a587; --acc2:#0f8a71; --acc-soft:#dcf3ec; --r-lg:26px; --sh:0 2px 4px rgba(24,165,135,.06),0 14px 34px -16px rgba(24,165,135,.28);}
/* ---- 皮肤：复古 ---- */
[data-skin=retro]{ --bg:#efe6d2; --bg2:#e5d8bd; --card:#f8f1e1; --card2:#efe5cd;
  --ink:#33291b; --ink2:#6b5a41; --ink3:#98866a; --line:#dbcbab; --line2:#c4b18c;
  --acc:#a05a17; --acc2:#7f450f; --acc-soft:#f1e0c8; --acc-glow:rgba(160,90,23,.2);
  --r-lg:12px; --r-md:8px; --sh:3px 3px 0 rgba(51,41,27,.14); --sh-sm:2px 2px 0 rgba(51,41,27,.12);
  --font-ui:Georgia,'Songti SC','SimSun',serif; }
/* ---- 皮肤：轻拟态 ---- */
[data-skin=soft]{ --bg:#e8e6df; --bg2:#e8e6df; --card:#e8e6df; --card2:#e8e6df;
  --ink:#3c423f; --ink2:#6d746f; --ink3:#959b96; --line:#f4f2ec; --line2:#d3d0c7;
  --acc:#4e7d74; --acc2:#3d6a61; --acc-soft:#dbe4e0; --sh:9px 9px 22px #cac8c1,-9px -9px 22px #fdfdf7; --sh-sm:5px 5px 12px #cac8c1,-5px -5px 12px #fdfdf7;}
[data-skin=soft] .card{border-color:transparent}

html,body{height:100%;margin:0;background:#0d1210;font-family:var(--font-ui);color:var(--ink)}
*{-webkit-tap-highlight-color:transparent}
::selection{background:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
.tabnum{font-variant-numeric:tabular-nums}

/* ============ 舞台 / 手机壳 ============ */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:34px;padding:28px;
  background:radial-gradient(1100px 620px at 18% -8%,#1c332d 0%,transparent 55%),
             radial-gradient(900px 560px at 92% 108%,#22322c 0%,transparent 52%),#0d1210;}
.phone{width:402px;height:874px;border-radius:52px;background:linear-gradient(160deg,#2a2f2c,#111413);
  padding:10px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.07) inset;position:relative;flex:none}
.phone::before{content:'';position:absolute;inset:6px;border-radius:47px;border:1px solid rgba(255,255,255,.09);pointer-events:none;z-index:5}
.viewport{width:100%;height:100%;border-radius:43px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
@media (max-width:900px){.stage{padding:0;gap:0}.phone{width:100vw;height:100dvh;border-radius:0;padding:0}.phone::before{display:none}.viewport{border-radius:0}.desk{display:none!important}}

/* 侧栏（桌面预览坞） */
.desk{width:314px;flex:none;color:#cfe0d8;font-size:12.5px;line-height:1.75}
.desk h1{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#fff;margin:0 0 2px}
.desk .dot-line{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.desk .pip{width:9px;height:9px;border-radius:99px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.desk-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;margin-bottom:12px;backdrop-filter:blur(6px)}
.desk-card b{display:block;color:#fff;font-size:12px;letter-spacing:.14em;font-weight:700;margin-bottom:8px}
.dbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#dcece5;cursor:pointer;font-size:12px;font-family:inherit;margin:3px 2px 0 0}
.dbtn:hover{background:rgba(255,255,255,.12)}
.dbtn.on{background:#41c3ad;border-color:#41c3ad;color:#06231e;font-weight:600}
.dlink{color:#8fd8c6;cursor:pointer;text-decoration:underline dotted 1px;text-underline-offset:3px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}

/* ============ 状态栏 / 顶栏 ============ */
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 6px;font-size:12.5px;font-weight:600;letter-spacing:.02em;flex:none;background:var(--bg);z-index:30}
.statusbar svg{opacity:.85}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:99px;background:#0a0c0b;z-index:40}
.appbar{flex:none;background:var(--bg);padding:2px 16px 10px;display:flex;align-items:center;gap:10px;z-index:20}
.appbar .t{font-size:21px;font-weight:800;letter-spacing:-.02em;flex:1}
.appbar .t small{font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:0;margin-left:8px}

/* ============ 主体滚动画布 ============ */
.body{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding:0 16px 108px;position:relative}
.body::-webkit-scrollbar{width:0}
.view{display:none}.view.on{display:block;animation:vfade .26s ease}
@keyframes vfade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.pushpage{position:absolute;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,.26,1)}
.pushpage.in{transform:none}
.pushpage .pv-body{flex:1;overflow-y:auto;padding:0 16px 96px}
.pushpage .pv-body::-webkit-scrollbar{width:0}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:16px}
.card.flat{box-shadow:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 9px}
.sec .h{font-size:14.5px;font-weight:750;letter-spacing:-.01em}
.sec .x{font-size:11.5px;color:var(--acc);cursor:pointer;font-weight:600}
.muted{color:var(--ink3)}
.hairline{height:1px;background:var(--line);border:0;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;font-family:inherit;
  background:var(--acc);color:var(--acc-ink);font-weight:650;font-size:14px;border-radius:12px;padding:11px 18px;transition:.18s;box-shadow:0 8px 18px -8px var(--acc-glow)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}
.ibtn{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--ink);transition:.15s}
.ibtn:hover{border-color:var(--line2)}
.ibtn:active{transform:scale(.92)}
.ibtn.plain{background:transparent;border-color:transparent;width:34px;height:34px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5.5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;white-space:nowrap;transition:.15s;font-weight:550}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:650}
.chip.violet.on{background:var(--vio);border-color:var(--vio);color:#fff}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg span{flex:1;text-align:center;font-size:12.5px;padding:6.5px 4px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:550;transition:.18s;white-space:nowrap}
.seg span.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm);font-weight:700}
.sw{width:44px;height:26px;border-radius:99px;background:var(--track);position:relative;cursor:pointer;transition:.22s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:2.5px;left:3px;width:19px;height:19px;border-radius:99px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.22s cubic-bezier(.4,1.4,.5,1)}
.sw.on{background:var(--acc);border-color:var(--acc)}
.sw.on::after{left:20px}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--ink);font-family:inherit;outline:none;transition:.15s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow);background:var(--card)}
.inp::placeholder{color:var(--ink3)}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.03em}
.dot{width:7px;height:7px;border-radius:99px;flex:none}
.row{display:flex;align-items:center;gap:12px}
.press{cursor:pointer;transition:.15s}.press:active{transform:scale(.985)}
.divider-label{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:11px;margin:14px 0}
.divider-label::before,.divider-label::after{content:'';height:1px;background:var(--line);flex:1}
.kbd-num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}

/* 图标格（宫格入口） */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:.18s;position:relative}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-sm)}
.tile .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.tile .lb{font-size:11px;color:var(--ink2);font-weight:550}
.tile .lock{position:absolute;top:7px;right:8px;font-size:8.5px;color:var(--ink3);border:1px solid var(--line2);border-radius:5px;padding:0 3px}

/* SVG 图标统一 */
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}
svg.i.xs{width:13px;height:13px;stroke-width:2}
svg.i.lg{width:24px;height:24px}
svg.i.thin{stroke-width:1.4}

/* ============ 底部导航 ============ */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;z-index:50;display:flex;padding:8px 6px 22px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturation(1.3);border-top:1px solid var(--line)}
.tabbar::after{content:'';position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:126px;height:4.5px;border-radius:99px;background:var(--ink);opacity:.16}
.tbi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5px;cursor:pointer;color:var(--ink3);position:relative;transition:.18s}
.tbi span{font-size:10.5px;font-weight:550;letter-spacing:.02em}
.tbi::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(.3);width:18px;height:3px;border-radius:0 0 4px 4px;background:var(--acc);opacity:0;transition:.22s}
.tbi.on{color:var(--acc)}
.tbi.on::before{opacity:1;transform:translateX(-50%) scaleX(1)}
.tbi.on span{font-weight:700}

/* FAB */
.fab{position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:18px;z-index:52;border:0;cursor:pointer;
  background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 28px -10px var(--acc-glow),0 4px 12px rgba(0,0,0,.18);transition:.2s}
.fab:hover{border-radius:26px}
.fab:active{transform:scale(.92)}
.fab.hide{display:none}

/* ============ 弹层 Sheet ============ */
.scrim{position:absolute;inset:0;background:rgba(9,14,12,.5);backdrop-filter:blur(2.5px);opacity:0;pointer-events:none;transition:.25s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--card);border-radius:var(--sheet) var(--sheet) 0 0;z-index:80;
  transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,.26,1);display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.2);border:1px solid var(--line);border-bottom:0}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4.5px;border-radius:99px;background:var(--line2);margin:10px auto 2px;flex:none}
.sheet .sh-head{padding:8px 20px 12px;display:flex;align-items:center;gap:10px;flex:none}
.sheet .sh-head b{font-size:16.5px;font-weight:750;letter-spacing:-.01em;flex:1}
.sheet .sh-body{overflow-y:auto;padding:0 20px 26px}
.sheet .sh-body::-webkit-scrollbar{width:0}

/* toast */
.toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-14px);z-index:99;background:var(--ink);color:var(--bg);
  font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:88%;text-overflow:ellipsis;overflow:hidden;box-shadow:var(--sh)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 内嵌滚轮 ============ */
.wheel{flex:1;min-width:0;height:150px;overflow-y:scroll;scroll-snap-type:y mandatory;position:relative;
  mask:linear-gradient(180deg,transparent 0,#000 26%,#000 74%,transparent 100%);-webkit-mask:linear-gradient(180deg,transparent 0,#000 26%,#000 74%,transparent 100%)}
.wheel::-webkit-scrollbar{display:none}
.wheel>div{scroll-snap-align:center;height:38px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:550;transition:.14s}
.wheel>div.mid{color:var(--acc);font-size:21px;font-weight:800}
.wheels{display:flex;gap:6px;align-items:center}
.wheels::before,.wheels::after{content:'';position:absolute;left:0;right:0;height:38px;border-radius:10px;background:var(--acc-soft);pointer-events:none}
.wheels{position:relative}
.wheels::before{top:56px}.wheels::after{content:none}
.wcol{flex:1;text-align:center;font-size:10.5px;color:var(--ink3);letter-spacing:.1em;margin-top:2px}
.wheel-wrap{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px 8px}

/* ============ 迷你月历 ============ */
.mcal{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden}
.mcal .wk,.mcal .grid7{display:grid;grid-template-columns:repeat(7,1fr)}
.mcal .wk span{text-align:center;font-size:10px;color:var(--ink3);padding:8px 0 4px;font-weight:600}
.mcal .cell{position:relative;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border-radius:10px;margin:1.5px;font-weight:550;transition:.15s}
.mcal .cell:hover{background:var(--card2)}
.mcal .cell.dim{color:var(--ink3);opacity:.45}
.mcal .cell.sel{background:var(--acc);color:var(--acc-ink);font-weight:700;box-shadow:0 6px 14px -6px var(--acc-glow)}
.mcal .cell .d{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.mcal .cell.sel .d i{background:#fff!important;opacity:.9}
.mcal .d i{width:4.5px;height:4.5px;border-radius:99px;display:block}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(207,63,47,.55)}55%{box-shadow:0 0 0 5px rgba(207,63,47,0)}}
.st-live{background:var(--danger)!important;animation:pulseDot 1.6s infinite}

/* ============ 时间块网格 ============ */
.gwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px}
.ggrid{display:grid;gap:1.5px;user-select:none;touch-action:none}
.gcell{border-radius:2.5px;background:var(--card2);cursor:pointer;transition:background .12s;min-height:0}
.gcell:hover{outline:1px solid var(--acc);outline-offset:-1px}
.gcell.sel{outline:2px solid var(--acc);outline-offset:-2px;z-index:1;position:relative}
.gcell.hourline{box-shadow:inset 0 1.5px 0 0 var(--line2)}
.glegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--ink3)}
.glegend i{width:8px;height:8px;border-radius:2.5px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* 时间轴 */
.tl{position:relative;padding-left:56px}
.tl::before{content:'';position:absolute;left:44px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl .tk{position:absolute;left:0;top:2px;width:38px;text-align:right;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl .ln{position:absolute;left:38px;width:14px;height:1.5px;background:var(--line2)}
.tl .now{position:absolute;left:-6px;right:-6px;height:0;border-top:1.5px dashed var(--danger);z-index:3}
.tl .now b{position:absolute;right:0;top:-16px;font-size:10px;color:var(--danger);background:var(--danger-soft);padding:1px 6px;border-radius:99px}
.evcard{border-left:0!important;position:relative}
.stripe{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:99px}

/* 四象限 */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);padding:12px;min-height:170px;box-shadow:var(--sh-sm)}
.qcard .qh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:750;margin-bottom:9px}
.qitem{display:flex;align-items:flex-start;gap:8px;padding:8px 8px 8px 10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;margin-bottom:7px;font-size:12.5px;line-height:1.45;position:relative;cursor:grab;transition:.16s}
.qitem:hover{border-color:var(--line2)}
.qitem.drag{opacity:.35}
.qcard.over{outline:2px dashed var(--acc);outline-offset:2px}
.qx{margin-left:auto;color:var(--ink3);cursor:pointer;flex:none;padding:1px 3px;border-radius:6px}
.qx:hover{color:var(--danger);background:var(--danger-soft)}

/* 勾选圈 */
.ck{width:21px;height:21px;border-radius:99px;border:1.8px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s;color:transparent;background:transparent;padding:0}
.ck:hover{border-color:var(--acc)}
.ck.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ck.violet.on{background:var(--vio);border-color:var(--vio);color:#fff}

/* 进度环 */
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .rv{position:absolute;text-align:center;line-height:1.05}

/* 条形图 */
.hbar{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:7px}
.hbar .bar{flex:1;height:7px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.hbar .bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.spark{width:100%;height:52px}
.spark polyline{fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark polygon{fill:var(--acc);opacity:.09}
.spark circle{fill:var(--card);stroke:var(--acc);stroke-width:2}

/* 日记 INS 卡 */
.ins{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;margin-bottom:14px}
.ins .ihead{display:flex;align-items:center;gap:9px;padding:12px 14px}
.ins .ava{width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;flex:none}
.ins .igrid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.ins .igrid div{aspect-ratio:1;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px}
.ins .acts{display:flex;gap:16px;padding:10px 14px;color:var(--ink2)}
.mood-big{font-size:44px;line-height:1;filter:saturate(1.15)}

/* 番茄专注全屏 */
.pomo{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(620px 460px at 20% -6%,#1d4d45,transparent 60%),radial-gradient(680px 520px at 105% 108%,#123c50,transparent 58%),#0b1614;color:#e8f5ef;
  opacity:0;pointer-events:none;transition:.32s}
.pomo.on{opacity:1;pointer-events:auto}
.pomo .mot{font-size:13.5px;letter-spacing:.16em;color:#8fc4b6;font-weight:600}
.pomo .ptime{font-size:57px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums}

/* 悬浮计时条 */
.floater{position:absolute;left:14px;right:14px;bottom:90px;z-index:56;display:none;align-items:center;gap:10px;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;box-shadow:0 16px 34px -12px rgba(0,0,0,.5);font-size:12.5px}
.floater.on{display:flex;animation:vfade .3s}
.floater .fpulse{width:8px;height:8px;border-radius:99px;background:#ff5d52;animation:pulseDot 1.4s infinite;flex:none}

/* 设置列表 */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow .lic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.lrow .lt{flex:1;font-size:14px;font-weight:600}
.lrow .ls{font-size:11.5px;color:var(--ink3);text-align:right;max-width:44%;line-height:1.35}

/* 搜索浮层 */
.finder{position:absolute;inset:0;z-index:85;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);padding:58px 18px 20px;display:none;flex-direction:column}
.finder.on{display:flex;animation:vfade .2s}

/* 空态 */
.empty{padding:34px 10px;text-align:center;color:var(--ink3)}
.empty .eic{width:52px;height:52px;border-radius:16px;background:var(--card2);border:1px dashed var(--line2);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}

/* 农历/角标等小件 */
.lunar{font-size:9px;color:var(--ink3);letter-spacing:-.02em;line-height:1;margin-top:1px}
.tagpill{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.strike{text-decoration:line-through;color:var(--ink3)}
.dim{opacity:.45;transition:.25s}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.breathe{animation:breathe 1.8s infinite}
@keyframes slidein{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.si{animation:slidein .28s ease both}
</style>

function bindWheels(root){$$('.wheel',root).forEach(w=>{
 w.scrollTop=w.dataset.v*38;
 let t;const upd=()=>{const i=Math.max(0,Math.min(w.children.length-1,Math.round(w.scrollTop/38)));w._i=i;
   [...w.children].forEach((c,j)=>c.classList.toggle('mid',j===i));w.dispatchEvent(new CustomEvent('wpick',{bubbles:true}))};
 w.addEventListener('scroll',()=>{upd();clearTimeout(t);t=setTimeout(()=>{const i=Math.round(w.scrollTop/38);if(i*38!==w.scrollTop)w.scrollTo({top:i*38,behavior:'smooth'})},90)},{passive:true});
 upd();})}
const wv=w=>w._i|0;
const HRS=Array.from({length:24},(_,i)=>pad(i)+':00'),MINS=Array.from({length:12},(_,i)=>pad(i*5));
function twheels(names,h=nowM()/60|0,m=Math.round(nowM()%60/5)){return `<div class="wheel-wrap"><div class="wheels" style="height:150px">

function ringSvg(p,size=44,sw=5,color='var(--acc)'){const r=(size-sw)/2,c=2*Math.PI*r;
 return `<span class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">
 <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--line)" stroke-width="${sw}"/>
 <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}"/></svg></span>`}
function sparkSvg(arr,w=280,h=52,padY=6){const mn=Math.min(...arr),mx=Math.max(...arr),rg=(mx-mn)||1;
 const pts=arr.map((v,i)=>[padY+i*(w-2*padY)/(arr.length-1),h-padY-(v-mn)/rg*(h-2*padY)]);
 const d=pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="${padY},${h} ${d} ${w-padY},${h}"/><polyline points="${d}"/>
 <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3"/></svg>`}
const catDot=(id)=>`<i class="dot" style="background:${cat(id).c};display:inline-block"></i>`;
const evStatusBadge=e=>e.st==='live'?`<span class="badge" style="background:var(--danger-soft);color:var(--danger)">● 进行中</span>`:
 e.st==='done'?`<span class="badge" style="background:var(--ok-soft);color:var(--ok)">✓ 已完成</span>`:`<span class="badge" style="background:var(--blue-soft);color:var(--blue)">⚡ 计划</span>`;
const evOf=d=>EVTS.filter(e=>e.date===d&&(d!==TODAY||nowM()>=e.s||e.st!=='done')||e.date===d).sort((a,b)=>a.s-b.s);
const dayDots=d=>{const es=EVTS.filter(e=>e.date===d);if(!es.length)return '';
 const st=es.some(e=>e.st==='live')?'live':es.some(e=>e.st==='plan')?'plan':'done';
 const c=st==='live'?'var(--danger)':st==='plan'?'var(--blue)':'var(--ok)';
 return `<i class="${st==='live'?'st-live':''}" style="background:${c}"></i>`};

let afterRender=()=>{const ta=$('#edTA');if(ta&&ED.cur){ta.addEventListener('input',()=>{ED.cur.md=ta.value;
  const pv=$('#edPV');if(pv)pv.innerHTML=mdRender(ta.value);const sd=$('#edSave');if(sd)sd.textContent='自动保存 · 刚刚';});
  if(ED.dim){const pv=$('#edPV');if(pv){pv.addEventListener('pointerover',e=>{[...pv.children].forEach(c=>c.classList.toggle('dim',c!==e.target&&c.contains&&!c.contains(e.target)))},true);}}}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('on'))closeSheet();else if(S.stack.length)pop();else if($('#finder').classList.contains('on'))ACT.closeFinder()}});
window.addEventListener('error',e=>toast('原型脚本提示：'+e.message.slice(0,40)));
render();
</script>
</body>
</html>
