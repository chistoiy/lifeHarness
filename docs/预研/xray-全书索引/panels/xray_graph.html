。”"]}, {"name": "卢克", "lines": 197, "eg": ["“那是因为信号要求，临时停车，不是你所说的‘停’。你不应该下车。”", "“要是四点二十五分的那班车是去伦敦的，”", "“噢，对不起，我不是说……我只是看你的肤色很深，大概是从东部回来休假的吧？”"]}, {"name": "警督", "lines": 178, "eg": ["“晚上好，先生们，”", "“目前为止还没发现。艾克罗伊德先生从不把特别贵重的物品放在这间屋子里。”", "“我们好像以前在哪儿见过面，先生，”"]}, {"name": "艾丽", "lines": 174, "eg": ["“我也想要这种房子。”", "“是什么风把你们刮到吉卜赛庄来了？”", "“好……好可怕的女人。”"]}, {"name": "玛丽", "lines": 154, "eg": ["“这可是罗尔斯顿太太极力邀请的，她是塔明斯特夫人的妹妹。当年罗尔斯顿家和征服者（注：征服者，即指一〇六六年征服英国的英国国王威廉一世。）一起来到这儿，是我们最古", "“我不知道。他正在搭纸牌房子，忽然说有了个想法，于是，就像你看到的那样，他跑了出去。”", "“你离开了好久，宝贝。”"]}, {"name": "乔治", "lines": 144, "eg": ["“时常让我感到惊奇的是，你明明之前一直都只服务于贵族家庭，却能屈尊来做我的仆人。我想这可能是出于你对冒险的热爱吧。”", "“可不能这么说，先生。”", "“先生，这对我来说有点儿难以想象。”"]}, {"name": "韦斯顿", "lines": 136, "eg": ["“手枪很有可能在海底。也就是说，如果这个凶手稍微有点常识的话。”", "“霍克斯，你守在这里，不准任何人靠近这个海湾。我随后就把菲利普也派来。”", "“尽管如此，我可从未忘记过那个案子。”"]}, {"name": "吉米", "lines": 134, "eg": ["“我看见是你自己把钥匙放进包里的，亲眼看见的。”", "“你至少掉过十几次，另外你还总是把钥匙落在各种地方。”", "“为什么别的东西不容易掉出来呢？”"]}, {"name": "贾尔斯", "lines": 132, "eg": ["“哦，实在太感谢你了，马普尔小姐，”", "“除非你的生活中完全没有任何瑕疵可担忧。”", "“我就没什么可担忧的。”"]}, {"name": "瑞斯", "lines": 126, "eg": ["“我们也得切牌分组。”", "“5方块。三局两胜。”", "“那就结算总分吧。”"]}, {"name": "埃莉诺", "lines": 110, "eg": ["“我还以为是账单呢——仲夏，你知道的，精灵翩翩起舞的时候，账单也纷至沓来了！”", "“这个更可怕。是一封匿名信。”", "“一定要烧掉！怎么会有这样奇怪的人！”"]}, {"name": "布尔斯特罗德", "lines": 108, "eg": ["“真的，这座体育馆看起来威风极了。我没想到它能按时完工。”", "“恐怕这是不太可能的。”", "“完全正确。但这是我的学校。”"]}, {"name": "哈卡斯特", "lines": 107, "eg": ["“这椅子看起来挺舒服。”", "“那里应该是摆着一对蜡烛台的其中一个。”", "“‘大城市小地方保险公司’呢？”"]}, {"name": "赫斯特", "lines": 105, "eg": ["“斯莱克警督会蔑视这种单刀直入向这位年轻女士讯问的简单做法。”", "“不想让她担惊受怕，”", "“她可是知道杰奎能有多讨厌的。”"]}, {"name": "菲利普", "lines": 104, "eg": ["“不是的，但当时我们都很生气，而且我觉得说了很多多余的话。我没怎么留意我母亲实际都说了什么。”", "“我错了？是吗？我在他的房间里抓到了你！你这个妖精，我要宰了你！”", "“心不在焉又健忘的科学家？这么想倒是不错。”"]}, {"name": "贾普", "lines": 101, "eg": ["“哦，我忘了给你介绍，”", "“或许有那样做的原因吧，”", "“你们国家依旧存在着待客之仪。”"]}, {"name": "梅尔切特", "lines": 96, "eg": ["“当我听说那个家伙去警察局自首时，大吃一惊。”", "“你要知道的是，死者是当场死亡。小傻瓜，他这么做是为了什么呢？对了，令人惊奇的是，没有人听到枪声。”", "“书房的门、食品储藏室的门和厨房的门全关着，听不到声音也是正常的，并且，房子里只有女佣一个人。”"]}, {"name": "斯彭斯", "lines": 88, "eg": ["“哦，天哪——我真心希望我用不着上治安法庭去做证。”", "“还有舆论的帮助呢，克洛德先生，”", "“第一回合是大卫·亨特赢了。”"]}, {"name": "拉斐尔", "lines": 84, "eg": ["“那又怎么样？”", "“我不喜欢帆布鞋，”", "“他总是有一大堆有趣的故事可讲。”"]}, {"name": "维拉", "lines": 82, "eg": ["“我和这位小姐一起等吧。”", "“我叫维拉·克莱索恩。”", "“我对德文郡的这一带很不熟悉。我从小在德文郡东部生活，就在多尔塞特旁边。”"]}, {"name": "查尔斯爵士", "lines": 79, "eg": ["“她已经跟着我六年了。”", "“这位自大狂是谁？”", "“一个古怪的家伙。”"]}, {"name": "杰普", "lines": 78, "eg": ["“我可怜的艾米丽还没入殓，我非常不想再有这种骗人的传言，你对此感到惊奇吗？”", "“跟你相比，先生，”", "“黑斯廷斯上尉也一样。”"]}, {"name": "约翰逊", "lines": 78, "eg": ["“所以，推荐信也许是伪造的？”", "“恐怕我能告诉你的很少。”", "“但我仍然觉得我本来可能抓住凶手的。”"]}, {"name": "乔安娜", "lines": 74, "eg": ["“玛丽怎么了？”", "“所以知道不是股票经纪人写来的？非常正确。实际上我是昨天从他们那里听到消息的。可怜的乔安娜的字迹太容易辨认了——就像是一只烂醉如泥的蜘蛛在信纸上到处乱爬。”", "“简直就像个烟囱，”"]}, {"name": "查尔斯", "lines": 70, "eg": ["“来吧，伙计。”", "“这是它惯常的娱乐项目。”", "“不完全是这样。我原本要找的人是你。你妹妹告诉我你出国了。”"]}, {"name": "布克", "lines": 67, "eg": ["“这次算是离家远行了吧，亲爱的？”", "“你怎么看这两个人？”", "“他们是美国人。”"]}, {"name": "德莫特", "lines": 67, "eg": ["“不，你必须得有处方。”", "“我们这儿的谋杀案绝对能引起苏格兰场  [1]  的注意。”", "“他们把案子移交给我们了，”"]}, {"name": "罗莎蒙德", "lines": 66, "eg": ["“我年轻的时候（哎，小姐，说来话长，那可是好久以前的事了），流行过一个游戏叫‘若不做你自己，你想做谁’？你可以把答案写在那种年轻女孩用的小本本里，就是那种带金边", "“你说得不错，她的两眼只看一样东西——男人。”", "“确实不是她的对手，正像你说的那样。”"]}, {"name": "爱德华", "lines": 66, "eg": ["“我们去散散步吧，亨莉埃塔。”", "“说真的，米奇，”", "“当然不能从阿尔弗雷治夫人那里买。”"]}, {"name": "派克威", "lines": 66, "eg": ["“他们这么说了？也对，他们可能是知道的。”", "“我和他相当熟悉，是这样。”", "“在我这里说话你不需要谨小慎微，”"]}, {"name": "凯瑟琳", "lines": 63, "eg": ["“我恐怕不会有这些顾虑。”", "“整个村子肯定都像我一样为你高兴。”", "“非常感谢您前来看我。”"]}, {"name": "理查德", "lines": 63, "eg": ["“是的，帕特里克和弗朗西斯都死了，你和我从此再也没尝到过幸福的滋味，但如果我们做出相应的牺牲呢？”", "“我们四个是法官，是陪审团，也是行刑者。我们将执行彼此的死刑。”", "“对不起，珍妮，但哈里特说得对。”"]}, {"name": "雷蒙德", "lines": 62, "eg": ["“说真的，一旦我发现有人对我隐瞒实情，就难免怀疑背后或许有非常严重的内幕。您做得非常对。”", "“很高兴我撇清了嫌疑，”", "“除了赫尔克里·波洛，呃？”"]}], "aliases": [{"main": "奥利弗", "members": ["奥利弗", "奥利弗夫人"]}, {"main": "帕克", "members": ["帕克", "帕克·派恩"]}], "gaz_new_locs": [["英国", 2395], ["伦敦", 2065], ["美国", 1137], ["法国", 996], ["巴黎", 587], ["意大利", 462], ["德国", 423], ["印度", 358], ["巴格达", 293], ["埃及", 262], ["欧洲",  const d=R[bi];
 if(!window.__ff) window.__ff={per:1,loc:1,org:1,term:1,minn:10};
 const ff=window.__ff;
 $("#body").innerHTML=`<div class="legend">节点大小＝提及次数；连线＝同段共现。悬停查看。`+
  ["per","loc","org","term"].map(t=>`<label><input type="checkbox" ${ff[t]?"checked":""} onchange="tog('${t}')"><i class="dot" style="background:${COL[t]}"></i>${TYNAME[t]}</label>`).join("")+

 const cv=$("#cv"),g=cv.getContext("2d"),W=cv.width,H=cv.height;
 const nodes=d.nodes.filter(n=>ff[n.type]&&n.n>=ff.minn).slice(0,90).map(n=>({name:n.name,type:n.type,n:n.n,x:W/2+(Math.random()-.5)*500,y:H/2+(Math.random()-.5)*350,vx:0,vy:0}));
 const idx={};nodes.forEach((n,i)=>idx[n.name]=i);
 const es=d.edges.filter(e=>idx[e.s]!=null&&idx[e.t]!=null).slice(0,300);
 for(let it=0;it<260;it++){

   const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+40;d2=Math.max(d2,600);
   const f=2600/d2;a.vx+=dx*f/Math.sqrt(d2);a.vy+=dy*f/Math.sqrt(d2);b.vx-=dx*f/Math.sqrt(d2);b.vy-=dy*f/Math.sqrt(d2);
  }
  for(const e of es){const a=nodes[idx[e.s]],b=nodes[idx[e.t]];const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+1;

 }
